    <script>
      (function() {
        try {
          var saved = localStorage.getItem('aw_theme');
          var isDark = saved === 'dark';
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FBFBFA] dark:bg-[#111614] text-[#1E2923] dark:text-[#EAEFEA] transition-colors duration-200 antialiased font-tajawal selection:bg-[#0E7A5D]/20 selection:text-[#0E7A5D]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
